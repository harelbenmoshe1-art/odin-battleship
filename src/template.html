<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battleship</title>
</head>
<body>
  <main>
    <h1>Battleship</h1>
    <p id="game-status">Your turn. Choose a square on the opponents board.</p>

    <div class="boards">
      <section>
        <h2>Your board</h2>
        <div id="player-board" class="gameboard"></div>
      </section>

      <section>
        <h2>Opponent's board</h2>
        <div id="opponent-board" class="gameboard"></div>
      </section>
    </div>

    <button id="new-game" type="button">New Game</button>
  </main>
</body>
</html>
